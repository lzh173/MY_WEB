<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .user-panel {
            width: 250px;
            background-color: #34495e;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: white;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
        }

            .message.own {
                background-color: #e1f5fe;
                margin-left: auto;
                border-bottom-right-radius: 0;
            }

            .message.other {
                background-color: #f0f0f0;
                margin-right: auto;
                border-bottom-left-radius: 0;
            }

        .message-header {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .message-time {
            font-size: 0.7rem;
            color: #777;
            text-align: right;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background-color: #f9f9f9;
            border-top: 1px solid #ddd;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .send-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-left: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

            .send-button:hover {
                background-color: #2980b9;
            }

        .user-list {
            list-style: none;
            margin-top: 15px;
        }

        .user-item {
            padding: 8px 10px;
            margin-bottom: 5px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

            .login-form h2 {
                margin-bottom: 20px;
                text-align: center;
            }

        .username-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .join-button {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

            .join-button:hover {
                background-color: #27ae60;
            }
    </style>
</head>
<body>
    <!-- 登录模态框 -->
    <div class="login-modal" id="login-modal">
        <div class="login-form">
            <h2>加入聊天室</h2>
            <input type="text" class="username-input" id="username-input" placeholder="请输入您的用户名" maxlength="20">
            <button class="join-button" id="join-button">加入聊天</button>
        </div>
    </div>

    <!-- 聊天室主界面 -->
    <div class="header">
        <h1>简单聊天室</h1>
    </div>

    <div class="container">
        <div class="user-panel">
            <h3>在线用户</h3>
            <ul class="user-list" id="user-list">
                <!-- 用户列表将动态加载 -->
            </ul>
        </div>

        <div class="chat-area">
            <div class="messages" id="messages">
                <!-- 消息将动态加载 -->
            </div>
            <div class="input-area">
                <input type="text" class="message-input" id="message-input" placeholder="输入消息..." disabled>
                <button class="send-button" id="send-button" disabled>发送</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentUser = null;
        let users = [];
        let messages = [];

        // DOM元素
        const loginModal = document.getElementById('login-modal');
        const usernameInput = document.getElementById('username-input');
        const joinButton = document.getElementById('join-button');
        const userList = document.getElementById('user-list');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        // 获取用户唯一标识
        function getUserId() {
            let userId = localStorage.getItem('chatUserId');
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('chatUserId', userId);
            }
            return userId;
        }

        // 加入聊天室
        function joinChat() {
            const username = usernameInput.value.trim();
            if (!username) {
                alert('请输入用户名');
                return;
            }

            currentUser = {
                id: getUserId(),
                name: username,
                joinTime: new Date()
            };

            // 保存用户信息到服务器
            saveUser(currentUser);

            // 隐藏登录模态框
            loginModal.style.display = 'none';

            // 启用消息输入
            messageInput.disabled = false;
            sendButton.disabled = false;

            // 加载用户列表和消息
            loadUsers();
            loadMessages();

            // 开始定期更新
            startPeriodicUpdates();
        }

        // 保存用户信息到服务器
        async function saveUser(user) {
            try {
                const response = await fetch('save_user.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(user)
                });

                if (!response.ok) throw new Error('保存用户信息失败');
            } catch (error) {
                console.error('保存用户信息失败:', error);
            }
        }

        // 从服务器获取用户列表
        async function loadUsers() {
            try {
                const response = await fetch('get_users.php');
                if (!response.ok) throw new Error('获取用户列表失败');

                users = await response.json();
                renderUserList();
            } catch (error) {
                console.error('获取用户列表失败:', error);
            }
        }

        // 渲染用户列表
        function renderUserList() {
            userList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.className = 'user-item';
                li.textContent = user.name;
                userList.appendChild(li);
            });
        }

        // 从服务器获取消息
        async function loadMessages() {
            try {
                const response = await fetch('get_messages.php');
                if (!response.ok) throw new Error('获取消息失败');

                messages = await response.json();
                renderMessages();
            } catch (error) {
                console.error('获取消息失败:', error);
            }
        }

        // 渲染消息
        function renderMessages() {
            messagesContainer.innerHTML = '';
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${message.userId === currentUser.id ? 'own' : 'other'}`;

                const header = document.createElement('div');
                header.className = 'message-header';
                header.textContent = message.username;

                const content = document.createElement('div');
                content.textContent = message.content;

                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = formatTime(message.time);

                messageDiv.appendChild(header);
                messageDiv.appendChild(content);
                messageDiv.appendChild(time);

                messagesContainer.appendChild(messageDiv);
            });

            // 滚动到底部
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // 格式化时间
        function formatTime(timeStr) {
            const time = new Date(timeStr);
            return `${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}`;
        }

        // 发送消息
        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content) return;

            const message = {
                userId: currentUser.id,
                username: currentUser.name,
                content: content,
                time: new Date().toISOString()
            };

            try {
                const response = await fetch('save_message.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(message)
                });

                if (!response.ok) throw new Error('发送消息失败');

                // 清空输入框
                messageInput.value = '';

                // 重新加载消息
                loadMessages();
            } catch (error) {
                console.error('发送消息失败:', error);
                alert('发送消息失败，请重试');
            }
        }

        // 开始定期更新
        function startPeriodicUpdates() {
            // 每5秒更新一次用户列表和消息
            setInterval(() => {
                loadUsers();
                loadMessages();
            }, 5000);
        }

        // 事件监听
        joinButton.addEventListener('click', joinChat);

        usernameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                joinChat();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
